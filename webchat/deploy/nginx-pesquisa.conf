# Drop this inside the existing `server { ... }` block for pccgo.cs.byu.edu
# (the one that already has the TLS certificate), then `nginx -t && systemctl reload nginx`.
#
# The app is then reachable at https://pccgo.cs.byu.edu/pesquisa/
# Change "/pesquisa/" in both places below to use a different path; the page
# uses only relative URLs, so any prefix works.

location = /pesquisa { return 301 /pesquisa/; }

location /pesquisa/ {
    proxy_pass         http://127.0.0.1:8100/;     # trailing slash strips the /pesquisa prefix
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;                        # LLM replies can take a while
    proxy_buffering    off;
    client_max_body_size 64k;
}
